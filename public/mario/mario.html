<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Full Screen Mario</title>

    <link href="mario.css" rel="stylesheet">
    <link href="Fonts/stylesheet.css" rel="stylesheet">

    <script src="data.js"></script>
    <script src="editor.js"></script>
    <script src="gamepad.js"></script>
    <script src="generator.js"></script>
    <script src="library.js"></script>
    <script src="load.js"></script>
    <script src="maps.js"></script>
    <script src="mario.js"></script>
    <script src="sprites.js"></script>
    <script src="things.js"></script>
    <script src="toned.js"></script>
    <script src="triggers.js"></script>
    <script src="upkeep.js"></script>
    <script src="utility.js"></script>
    
    <!-- Refactored libraries/frameworks under /src -->
    <script src="src/AudioPlayr/AudioPlayr.js"></script>
    <script src="src/TimeHandlr/TimeHandlr.js"></script>
    <script src="src/QuadsKeepr/QuadsKeepr.js"></script>

    <script>
      function initMario() {
        var vp = document.getElementById("game_viewport");
        if (vp) {
          window.body = vp;
          window.bodystyle = vp.style;
        }

        FullScreenMario();

        // Baseline resolution calibration
        setTimeout(function() {
          if (window.gamescreen) {
            window.baseGameWidth = window.gamescreen.unitwidth || (gamescreen.right - gamescreen.left) || 1000;
            window.baseGameHeight = window.gamescreen.unitheight || (gamescreen.bottom - gamescreen.top) || 540;
            if (vp) {
              vp.style.width = window.baseGameWidth + "px";
              vp.style.height = window.baseGameHeight + "px";
            }
          }
          updateScale();
        }, 30);
      }

      function updateScale() {
        var vp = document.getElementById("game_viewport");
        if (!vp) return;

        var baseW = window.baseGameWidth || (window.gamescreen ? window.gamescreen.unitwidth : 1000);
        var baseH = window.baseGameHeight || (window.gamescreen ? window.gamescreen.unitheight : 540);

        var winW = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
        var winH = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

        if (!baseW || !baseH || !winW || !winH) return;

        var scaleFit = Math.min(winW / baseW, winH / baseH);
        var scaleFillX = winW / baseW;
        var scaleFillY = winH / baseH;

        var mode = window.gameScaleMode || "fill";
        if (mode === "fit") {
          vp.style.setProperty("--game-scale-x", scaleFit);
          vp.style.setProperty("--game-scale-y", scaleFit);
        } else {
          // Fill 100% of the screen
          vp.style.setProperty("--game-scale-x", scaleFillX);
          vp.style.setProperty("--game-scale-y", scaleFillY);
        }
      }

      window.addEventListener("resize", updateScale);
      window.addEventListener("orientationchange", function() {
        setTimeout(updateScale, 100);
      });

      window.addEventListener("message", function(e) {
        if (!e.data) return;
        if (e.data.type === "setScaleMode") {
          window.gameScaleMode = e.data.mode;
          updateScale();
        } else if (e.data.type === "resize") {
          updateScale();
        }
      });
    </script>
</head>
<body onload="initMario()">
    <div id="game_viewport">
      <button id="unlimited_life" type="button" onclick="toggleAutoRespawn(this)" title="Automatically revive Mario after each death">NO CAP REVIVE: OFF</button>
    </div>
</body>
</html>
